name: Windows Desktop Build

# Intentionally manual-only to conserve GitHub Actions minutes.
# Run this workflow from the Actions tab only when a Windows build artifact is needed.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      Solution_Name: WC3MapDeprotector.sln
      Configuration: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Restore
        run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration

      - name: Build
        run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration

      - name: Setup publish folder
        run: |
          ren WC3MapDeprotector\bin\Release\net8.0-windows v1.3.0.4
          copy Launch_WC3MapDeprotector.bat WC3MapDeprotector\bin\Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WC3MapDeprotector
          path: WC3MapDeprotector\bin\Release
